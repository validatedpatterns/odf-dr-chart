---
# Namespace for ODF post-install Jobs (prerequisites checker).
clusterCaMgt:
  # -- Namespace for ODF CA prerequisites workloads.
  namespace: cluster-ca-mgt
  # -- Create clusterCaMgt.namespace when installing the chart.
  createNamespace: false

# ODF post-install automation: MirrorPeer + prerequisites checker.
odf:
  # -- Enable ODF post-install automation (MirrorPeer, prerequisites checker).
  postInstallFixesEnabled: true
  # When postInstallFixesEnabled is false: reserved for DRCluster S3 profile names.
  drCluster:
    # -- S3 profile name for the primary DRCluster CR. Required only when postInstallFixesEnabled is false.
    primaryS3ProfileName: ""
    # -- S3 profile name for the secondary DRCluster CR. Required only when postInstallFixesEnabled is false.
    secondaryS3ProfileName: ""

# DR pair cluster names. Must match ACM ManagedCluster metadata.name.
regionalDR:
  - # -- Name of this DR pair set. Must be unique within the regionalDR list.
    name: resilient
    clusters:
      primary:
        # -- ACM ManagedCluster name for the primary site.
        name: ocp-primary
      secondary:
        # -- ACM ManagedCluster name for the secondary site.
        name: ocp-secondary

# When odf.postInstallFixesEnabled is true: odf-dr-prerequisites job/RBAC.
odfDrPrerequisites:
  # -- CA completeness check mode. Use trust-bundle with vp-manage-proxy-cluster-ca
  # (validates PEM and identical CA ConfigMaps). legacy expects '# CA from …' markers.
  caMaterialMode: trust-bundle
  # -- CA ConfigMap name to validate (vp-manage-proxy-cluster-ca configMapName).
  caBundleName: vp-pattern-proxy-ca-bundle
  # -- Namespace of the CA ConfigMap.
  caBundleNamespace: openshift-config

ansible:
  # -- Container image used for Ansible post-install jobs.
  containerImage: quay.io/validatedpatterns/utility-container:latest
  # -- Ansible-playbook verbosity level (0–4).
  verbosity: 0
  # -- Argo CD resource sync-options applied to the Ansible ConfigMap.
  configMapArgoSyncOptions: Prune=false,ServerSideApply=true
